<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search demo browser regression checks</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; margin: 24px; }
    iframe { width: 100%; height: 600px; border: 1px solid #999; }
    #output { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Search demo browser regression checks</h1>
  <p>Build the WebAssembly module and serve the repository root before opening this page.</p>
  <pre id="output" role="status" data-state="running">Running…</pre>
  <iframe id="demo" src="../demo/" title="Search demo under test"></iframe>
  <script type="module">
    const output = document.getElementById('output');
    const frame = document.getElementById('demo');
    let checks = 0;
    const check = (condition, message) => {
      if (!condition) throw new Error(message);
      checks++;
    };
    const waitFor = async predicate => {
      const deadline = performance.now() + 20000;
      while (!predicate()) {
        if (performance.now() > deadline) throw new Error('Timed out waiting for the demo.');
        await new Promise(resolve => setTimeout(resolve, 50));
      }
    };
    try {
      await waitFor(() => frame.contentDocument?.querySelector('#engine-status')?.dataset.state === 'ready');
      const doc = frame.contentDocument;
      const cards = () => [...doc.querySelectorAll('.result')];
      const search = query => {
        doc.querySelector('#query').value = query;
        doc.querySelector('#search-form').dispatchEvent(new frame.contentWindow.Event('submit', { cancelable: true }));
      };
      check(!doc.querySelector('#search-controls').disabled, 'Controls should be enabled.');
      check(doc.querySelectorAll('#documents details').length === 4, 'All sample texts should be available.');
      check(cards().length === 3, 'Initial prefix search should find three documents.');
      check(cards()[0].querySelector('.document-name').textContent === 'testfile3.txt', 'Prefix ordering differs.');
      check(cards()[0].querySelector('.score').textContent === 'Score 0.174208', 'Prefix score differs.');
      check([...doc.querySelectorAll('#suggestions button')].map(x => x.textContent).join(',') === 'fox,foxes', 'Prefix suggestions differ.');
      doc.querySelector('#suggestions button').click();
      check(doc.querySelector('#query').value === 'fox' && cards().length === 2, 'Suggestion buttons should search.');
      doc.querySelector('[data-query="fo*"]').click();
      check(cards().length === 3, 'Example buttons should search.');
      search('"quick brown fox"');
      check(cards().length === 2, 'Phrase query should find two documents.');
      check(cards().every(card => card.querySelector('.phrase-count').textContent === 'Complete phrase occurrences: 1'), 'Phrase counts differ.');
      check(doc.querySelector('#suggestions').hidden, 'Phrase query must clear prefix suggestions.');
      search('fox AND');
      check(!doc.querySelector('#query-error').hidden, 'Invalid query should display an error.');
      check(cards().length === 0, 'Invalid query must clear stale results.');
      check(doc.querySelector('#query').getAttribute('aria-invalid') === 'true', 'Invalid input should be announced.');
      search('unfindableterm');
      check(doc.querySelector('#query-error').hidden, 'Valid empty query result must clear old errors.');
      check(doc.querySelector('#results-summary').textContent.startsWith('No matching documents'), 'Missing no-match message.');
      search('   ');
      check(!doc.querySelector('#query-error').hidden, 'Blank query should report validation failure.');
      search('fox');
      check(cards().length === 2 && doc.querySelector('#query-error').hidden, 'Search must recover after errors.');
      check(!doc.querySelector('#query').hasAttribute('aria-invalid'), 'Recovered input should clear aria-invalid.');
      search('<img src=x onerror=alert(1)>');
      check(doc.querySelectorAll('#result-list img, #results-summary img, #query-error img').length === 0, 'Query text must never become markup.');
      search('fo*');
      const { createSearchEngine } = await import('../wasm/search-engine.mjs');
      const engine = await createSearchEngine();
      try {
        const documents = await Promise.all(['testfile1.txt', 'testfile2.txt', 'testfile3.txt', 'extreme secret.txt'].map(async name => {
          const response = await fetch(`../data/sample/${encodeURIComponent(name)}`);
          if (!response.ok) throw new Error('Fixture fetch failed.');
          return { id: `data/sample/${name}`, text: await response.text() };
        }));
        engine.loadDocuments(documents);
        for (const query of ['fox', 'fo*', '"quick brown fox"', 'fox OR secret', 'fox - dog']) {
          search(query);
          const results = engine.search(query).results;
          check(cards().length === results.length, 'Rendered count differs from engine.');
          results.forEach((result, i) => {
            check(cards()[i].querySelector('.snippet').textContent === result.snippet, 'Rendered snippet differs.');
            check(cards()[i].querySelector('.score').textContent === `Score ${result.score.toFixed(6)}`, 'Rendered score differs.');
            check(cards()[i].querySelector('.result-path').textContent === `${result.document} · ${result.wordCount} indexed words`, 'Rendered document details differ.');
          });
        }
      } finally { engine.dispose(); }
      const bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
      const fixtureFiles = [
        new File(['nebula plain'], 'same.txt'), new File(['nebula second'], 'same.txt'),
        new File(['# nebula'], 'note.md'), new File(['name,value\nnebula,42'], 'table.csv'),
        new File(['{"name":"nebula"}'], 'data.json'),
        new File(['<p>nebula</p><p>document</p><script>forbidden()</scr' + 'ipt><img src="https://example.invalid/tracker">'], 'page.html'),
        new File(['<root><item>nebula</item></root>'], 'data.xml'),
        new File([bytes('JVBERi0xLjQKMSAwIG9iago8PCAvVHlwZSAvQ2F0YWxvZyAvUGFnZXMgMiAwIFIgPj4KZW5kb2JqCjIgMCBvYmoKPDwgL1R5cGUgL1BhZ2VzIC9LaWRzIFszIDAgUl0gL0NvdW50IDEgPj4KZW5kb2JqCjMgMCBvYmoKPDwgL1R5cGUgL1BhZ2UgL1BhcmVudCAyIDAgUiAvTWVkaWFCb3ggWzAgMCA2MTIgNzkyXSAvUmVzb3VyY2VzIDw8IC9Gb250IDw8IC9GMSA0IDAgUiA+PiA+PiAvQ29udGVudHMgNSAwIFIgPj4KZW5kb2JqCjQgMCBvYmoKPDwgL1R5cGUgL0ZvbnQgL1N1YnR5cGUgL1R5cGUxIC9CYXNlRm9udCAvSGVsdmV0aWNhID4+CmVuZG9iago1IDAgb2JqCjw8IC9MZW5ndGggNDYgPj4Kc3RyZWFtCkJUIC9GMSAxMiBUZiA3MiA3MjAgVGQgKG5lYnVsYSBkb2N1bWVudCkgVGogRVQKZW5kc3RyZWFtCmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMDkgMDAwMDAgbiAKMDAwMDAwMDA1OCAwMDAwMCBuIAowMDAwMDAwMTE1IDAwMDAwIG4gCjAwMDAwMDAyNDEgMDAwMDAgbiAKMDAwMDAwMDMxMSAwMDAwMCBuIAp0cmFpbGVyCjw8IC9TaXplIDYgL1Jvb3QgMSAwIFIgPj4Kc3RhcnR4cmVmCjQwNwolJUVPRgo=')], 'paper.pdf'),
        new File([bytes('UEsDBBQAAAAIAAxQaF2sbhJangAAANwAAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbF2PsQ7CMBBDf6XKitqrGBhQ24UdGPiBU3JtI5pLlBwF/p4EpA6Mlu1nubu9A6Xq5RZOvZpFwhEg6ZkcpsYH4uyMPjqULOMEAfUdJ4J92x5AexZiqaUw1NBdVorRGqquGOWMjnoFTx8NGK8fLiebTFPV6Vcry73CEBarUaxnWNn8bdZ+HK2mrV9oIXpNKVme3NJsjkPLu4KHoYPvqeEDUEsDBBQAAAAIAAxQaF1hey9DiQAAAPIAAAALAAAAX3JlbHMvLnJlbHONzzsOAiEQBuCrEA6ws1pYGKCy2dZ4AQLDIy6PDBj19lJYrMbCcuaffH9GnHHVPZbcQqyNPdKam+Sh93oEaCZg0m0qFfNIXKGk+xjJQ9Xmqj3Cfp4PQFuDK7E12WIlp8XuOLs8K/5jF+eiwVMxt4S5/6j4uhiyJo9d8nshC/a9ngbLQQn4eFG9AFBLAwQUAAAACAAMUGhdoOmW3nUAAAChAAAAEQAAAHdvcmQvZG9jdW1lbnQueG1sRc5RCsMwCAbgq5QeYJY97CFkuUuaZG0hajCWrLdf0zH28om/iNpmIocdE+nwxkzVtOe4qhYDUMOa0Ncbl0Tn7MWCXs9WFmgssQiHVOtGC2a4T9MD0G80OtvMzPHotXSko47SvGc//K5Z6GFXLsvldxH+T7kPUEsBAhQDFAAAAAgADFBoXaxuElqeAAAA3AAAABMAAAAAAAAAAAAAAIABAAAAAFtDb250ZW50X1R5cGVzXS54bWxQSwECFAMUAAAACAAMUGhdYXsvQ4kAAADyAAAACwAAAAAAAAAAAAAAgAHPAAAAX3JlbHMvLnJlbHNQSwECFAMUAAAACAAMUGhdoOmW3nUAAAChAAAAEQAAAAAAAAAAAAAAgAGBAQAAd29yZC9kb2N1bWVudC54bWxQSwUGAAAAAAMAAwC5AAAAJQIAAAAA')], 'paper.docx')
      ];
      const { readDocuments, validateFiles } = await import('../demo/file-import.mjs');
      const parsed = await readDocuments(fixtureFiles);
      check(parsed.length === 9, 'All supported fixture formats should parse.');
      check(new Set(parsed.map(item => item.id)).size === 9, 'Duplicate filenames must remain distinct.');
      check(parsed.every(item => item.text.includes('nebula')), 'Parser lost expected text.');
      check(!parsed[5].text.includes('forbidden') && parsed[5].text.includes('nebula document'), 'HTML extraction should exclude scripts and separate blocks.');
      const rejects = async (files, pattern) => {
        try { await readDocuments(files); } catch (error) { check(pattern.test(error.message), 'Wrong import error: ' + error.message); return; }
        throw new Error('Invalid file batch was accepted.');
      };
      await rejects([new File(['x'], 'old.doc')], /unsupported format/);
      await rejects([new File([''], 'empty.txt')], /No searchable text/);
      await rejects([new File([new Uint8Array([255, 254])], 'binary.txt')], /encoded|encoding|decode/i);
      await rejects([new File(['<root>'], 'bad.xml')], /Invalid XML/);
      await rejects([new File(['bad'], 'bad.pdf')], /PDF|pdf/i);
      await rejects([new File(['bad'], 'bad.docx')], /DOCX|bounds|Offset/i);
      try { validateFiles([{name:'large.txt',size:1048577}]); throw new Error('Size accepted'); }
      catch (error) { check(error.message.includes('1 MiB'), 'Missing byte cap.'); }
      await rejects([new File(['{'], 'bad.json')], /JSON|position|property/i);
      await rejects([new File(['word '.repeat(20001)], 'words.txt')], /20,000/);
      await rejects([new File(['a'.repeat(200001)], 'long.txt')], /200,000/);
      await rejects(Array.from({length:21}, () => new File(['text'], 'many.txt')), /20 files/);
      const abort = new AbortController(); abort.abort();
      try { await readDocuments([fixtureFiles[0]], {signal:abort.signal}); throw new Error('Abort ignored'); }
      catch(error) { check(error.message.includes('cancelled'), 'Cancelled import must stop.'); }
      check(!performance.getEntriesByType('resource').some(entry => entry.name.includes('example.invalid')), 'HTML extraction must not fetch embedded resources.');
      const select = async files => {
        const transfer = new frame.contentWindow.DataTransfer();
        for (const file of files) transfer.items.add(file);
        doc.querySelector('#local-files').files = transfer.files;
        doc.querySelector('#local-files').dispatchEvent(new frame.contentWindow.Event('change'));
        await waitFor(() => !doc.querySelector('#import-controls').disabled);
      };
      await select(fixtureFiles);
      search('nebula');
      check(cards().length === 9, 'Imported corpus should be searched by the C++ engine.');
      check(doc.querySelector('#sample-examples').hidden, 'Sample examples should hide for local collections.');
      await select([new File(['nebula valid'], 'valid.txt'), new File(['bad'], 'bad.pdf')]);
      check(!doc.querySelector('#import-error').hidden, 'Failed batch should display an error.');
      search('nebula');
      check(cards().length === 9, 'Failed batch must preserve the previous corpus.');
      doc.querySelector('#restore-samples').click();
      search('fo*');
      check(cards().length === 3 && !doc.querySelector('#sample-examples').hidden, 'Restore should replace local corpus with samples.');
      check(doc.querySelector('#documents').children.length === 4, 'Restore must remove uploaded document previews.');
      output.dataset.state = 'passed';
      output.textContent = `Browser regression checks passed (${checks} checks).`;
    } catch (error) {
      output.dataset.state = 'failed';
      output.textContent = `FAIL: ${error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
